name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - if: runner.os == 'Windows'
        run: |
          python -m venv .test-venv
          .test-venv\Scripts\python.exe -m pip install -e ".[dev]"
          .test-venv\Scripts\python.exe -m quran_reels.setup_windows
      - if: runner.os == 'Windows'
        run: .test-venv\Scripts\python.exe -m pytest -q
      - if: runner.os != 'Windows'
        run: python -m pytest -q
